        <div class="heroo">

            <div class="hero-contC">
                <div class="navC">
                    <div class="logoC">
                        <a href="index.html">

                            <img src="assets/HT/logowhitet.svg" alt="prudinstudios logo">
                        </a>
                    </div>
                    <div class="menuC">
                        <a href="index.html">
                            <img src="/assets/HT/proicons_cancelt.svg" alt="menu" class="menui">
                        </a>

                    </div>

                </div>
                <div class="heroMainC">
                    <div class="heroMainWrapC">
                        <div class="txtcontC ">
                            <div class="headingC">Better Together!</div>
                            <div class="subtxtC">Let's create awesome experiences
                                that makes you or your brand stand out.</div>
                        </div>
                        <form action="" class="inputFieldWrap realForm" id="myForm">

                            <div class="input-names">
                                <input type="text" placeholder="First Name" id="fname" class="inputF" name="_fname">
                                <input type="text" placeholder="Last Name" id="lname" class="inputF" name="_lname">
                            </div>
                            <input type="email" placeholder="Email" id="givenEmail" class="inputF" name="_email">
                            <input type="number"
                                oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);"
                                placeholder="Phone Number" inputmode="numeric" pattern="[0-9]" maxlength="10" id="pNo"
                                class="inputF [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
                                name="_number">
                            <textarea placeholder="Message" rows="4" id="messageArea" class="inputF"
                                style="resize: none;" name="_message"></textarea>
                            <div class="custom-btn" id="custom-btn"
                                >
                                <div class="btnTxt">Send</div>
                                <div class="btnIcon"><img src="/assets/Contact Page/submitsvg.svg" alt="" srcset="">
                                </div>
                            </div>
                        </form>

                    </div>
                    <div class="whatsapp-main">
                        <a href="https://wa.me/917678608299" target="_blank" >

                            <div class="wta-txt subtxt">Get Faster Response in WhatsApp !</div>
                            <div class="wta-img">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.27/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.7.1/dist/dotlottie-wc.js" type="module"></script>
    <script src="mini.js"></script>
    <script>




        const scriptURL = "https://script.google.com/macros/s/AKfycbw2hDYhec5m7wyBojJ1-UGDjKWoScF3_IF66Klo6UDaAN-mh7trlc8sIDg7AU0xWuPUDw/exec";

        const customBtn = document.getElementById("custom-btn");

        customBtn.addEventListener("click", async function (e) {

            e.preventDefault();

            const form = document.getElementById("myForm");

            const formData = new FormData(form);

            try {

                const response = await fetch(scriptURL, {
                    method: "POST",
                    body: formData
                });

                const result = await response.text();

                console.log(result);

                alert("Message Sent!");

                form.reset();

            } catch (error) {

                console.error(error);

                alert("Error sending message");

            }

        });

        
    </script>
